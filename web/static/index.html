<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/web/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/web/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/web/assets/apple-touch-icon.png">
<title>CopilotGateway</title>
<link rel="stylesheet" href="/web/assets/app.css">
<script src="/web/assets/app.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#waypoints"></use></svg></span>CopilotGateway</a>
    <div class="topbar-actions">
      <span class="topbar-meta" id="models-aux"></span>
      <a class="tool-btn" id="github" href="https://github.com/HeyJiqingCode/CopilotGateway" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#github"></use></svg></a>
      <button class="tool-btn" type="button" id="fetch"><svg class="icon" aria-hidden="true"><use id="fetch-icon" href="/web/assets/icons.svg#cloud-download"></use></svg></button>
      <div class="user-menu">
        <button class="tool-btn" type="button" id="user-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#circle-user-round"></use></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <div class="menu-head"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#circle-user-round"></use></svg><span class="menu-user" id="menu-user"></span></div>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item" type="button" role="menuitem" id="menu-lang"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#languages"></use></svg><span data-t="language"></span><span class="menu-value" id="lang-value"></span></button>
          <button class="menu-item danger" type="button" role="menuitem" id="menu-logout"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#log-out"></use></svg><span data-t="logout"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="card">
      <div class="card-head">
        <div class="card-title"><h2><svg class="icon text-blue" aria-hidden="true"><use href="/web/assets/icons.svg#plug"></use></svg><span data-t="connection"></span></h2></div>
      </div>
      <div class="connection" id="connection"></div>
    </section>

    <section class="card models-card">
      <div class="card-head">
        <div class="card-title">
          <h2><svg class="icon text-purple" aria-hidden="true"><use href="/web/assets/icons.svg#boxes"></use></svg><span data-t="models"></span></h2>
        </div>
        <div class="card-actions">
          <div class="filter">
            <button class="filter-pill" type="button" id="provider-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="provider-menu">
              <span class="filter-label" data-t="provider"></span><span class="filter-value" id="provider-value"></span>
              <svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#chevron-down"></use></svg>
            </button>
            <div class="menu filter-menu" id="provider-menu" role="listbox" hidden></div>
          </div>
        </div>
      </div>
      <div class="models-body">
        <div class="table-viewport scroll" id="table-viewport" hidden>
          <table class="table">
            <colgroup id="table-cols"></colgroup>
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="placeholder" id="placeholder">
          <div class="placeholder-title" id="placeholder-title"></div>
          <div class="placeholder-text" id="placeholder-text"></div>
        </div>
      </div>
      <aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
        <div class="drawer-head">
          <div class="drawer-identity">
            <span id="drawer-logo"></span>
            <div>
              <h3 class="drawer-title" id="drawer-title" tabindex="-1"></h3>
              <div class="drawer-sub" id="drawer-sub"></div>
            </div>
          </div>
          <button class="icon-btn" type="button" id="drawer-close"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#x"></use></svg></button>
        </div>
        <div class="drawer-body scroll" id="drawer-body"></div>
      </aside>
    </section>
  </main>
</div>

const state = {
  lang: CGW.getLang(), provider: '', models: [], cachedAt: null, loaded: false, loadError: '',
  apiKeys: [], username: '', openId: null, update: null,
};
const $ = id => document.getElementById(id);
const { esc, icon } = CGW;

function t(key, vars) {
  let s = I18N[state.lang][key] ?? key;
  for (const [k, v] of Object.entries(vars || {})) s = s.replaceAll(`{${k}}`, v);
  return s;
}

const LOGO_IDS = {};
(() => {
  const symbols = Object.entries(VENDOR_LOGOS).map(([vendor, logo], i) => {
    LOGO_IDS[vendor] = `vendor-logo-${i}`;
    return `<symbol id="vendor-logo-${i}" viewBox="0 0 24 24" ${logo.attrs}>${logo.body}</symbol>`;
  }).join('');
  document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true">${symbols}</svg>`);
})();

// Known vendors show their logo; any other vendor falls back to its initial.
function vendorLogo(vendor, size = '') {
  const id = LOGO_IDS[vendor];
  const inner = id ? `<svg aria-hidden="true"><use href="#${id}"></use></svg>` : esc((vendor || '?').slice(0, 1).toUpperCase());
  return `<span class="vendor-logo ${size}" title="${esc(vendor || '')}">${inner}</span>`;
}

// ---------- formatting ----------
const dash = '<span class="muted">—</span>';

function trimFixed(n, digits) { return String(Number(n.toFixed(digits))); }

function tokens(n) {
  if (n == null) return dash;
  if (n >= 1e6) return `${trimFixed(n / 1e6, 2)} M`;
  if (n >= 1e3) return `${trimFixed(n / 1e3, 1)} K`;
  return Number(n).toLocaleString('en-US');
}

// Upstream prices are US cents per 1M tokens; unit prices keep up to 4 decimals.
function price(cents) {
  if (cents == null) return dash;
  return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
}

function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function endpointTag(ep, full) {
  const info = ENDPOINTS[ep] || { label: ep, tone: 'tone-slate' };
  return `<span class="tag ${info.tone}">${esc(full ? ep : info.label)}</span>`;
}

// ---------- data ----------
const pricesOf = m => m.billing?.token_prices?.default || {};
// A catalog entry without a price basis (no default tier, or batch_size 0) is shown as not priced.
const isPriced = m => {
  const tp = m.billing?.token_prices;
  return Boolean(tp?.default) && tp.batch_size !== 0;
};

// Only models with at least one endpoint are listed.
function callableModels() {
  return state.models.filter(m => (m.supported_endpoints || []).length);
}

function visibleModels() {
  const list = callableModels();
  return state.provider ? list.filter(m => m.vendor === state.provider) : list;
}

// Providers in the catalog, most models first.
function providerOptions() {
  const counts = new Map();
  for (const m of callableModels()) if (m.vendor) counts.set(m.vendor, (counts.get(m.vendor) || 0) + 1);
  return [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

function groupedModels() {
  const groups = new Map([...CATEGORIES, 'other'].map(c => [c, []]));
  for (const m of visibleModels()) {
    groups.get(CATEGORIES.includes(m.model_picker_category) ? m.model_picker_category : 'other').push(m);
  }
  const inputPrice = m => pricesOf(m).input_price ?? -1;
  for (const list of groups.values()) {
    list.sort((a, b) => (a.vendor || '').localeCompare(b.vendor || '') || inputPrice(b) - inputPrice(a) || a.id.localeCompare(b.id));
  }
  return [...groups].filter(([, list]) => list.length);
}

function renderTable() {
  const showTable = state.loaded && !state.loadError && visibleModels().length > 0;
  $('table-viewport').hidden = !showTable;
  $('placeholder').hidden = showTable;
  if (!showTable) {
    const [title, text] = !state.loaded ? [t('loading'), '']
      : state.loadError ? [t('loadFail'), state.loadError]
      : [t('empty'), t('emptyText')];
    $('placeholder-title').textContent = title;
    $('placeholder-text').textContent = text;
    return;
  }

  const head = [['colModel', 'col-model'], ['colVendor', 'col-vendor'], ['colEffort', 'col-effort'], ['colContext', 'col-context'],
    ['colPrice', 'col-price'], ['colEndpoints', 'col-endpoints']];
  $('table-head').innerHTML = head.map(([k, cls]) => `<th class="${cls}">${esc(t(k))}</th>`).join('');
  $('table-cols').innerHTML = head.map(() => '<col>').join('');

  $('table-body').innerHTML = groupedModels().map(([cat, list]) => {
    const rows = list.map(m => {
      const lim = m.capabilities?.limits || {};
      const eps = sortedEndpoints(m);
      return `<tr class="model-row${m.id === state.openId ? ' is-selected' : ''}" data-id="${esc(m.id)}" tabindex="0">
        <td><div class="model-cell">${vendorLogo(m.vendor)}<div>
          <div class="model-name">${esc(m.name || m.id)}${m.preview ? `<span class="tag tone-amber">${esc(t('preview'))}</span>` : ''}${riskTags(m)}</div>
          <div class="model-id">${esc(m.id)}</div></div></div></td>
        <td>${m.vendor ? esc(m.vendor) : dash}</td>
        <td>${effortLevels(m.capabilities?.supports?.reasoning_effort)}</td>
        <td>${tokens(lim.max_context_window_tokens)}</td>
        <td>${priceCell(m)}</td>

  }).join('');
  balanceColumns();

// Each column is as wide as its widest content, and the width left over is
// shared out as equal gaps between columns, so the table fills the card at
// any window size. Below the minimum gap the table scrolls sideways.
const MIN_COL_GAP = 28;
function balanceColumns() {
  const viewport = $('table-viewport');
  const cols = [...$('table-cols').children];
  if (viewport.hidden || !cols.length) return;
  const contentWidth = cell => {
    const range = document.createRange();
    range.selectNodeContents(cell);
    return range.getBoundingClientRect().width;
  };
  const widths = [...$('table-head').children].map(contentWidth);
  for (const tr of $('table-body').querySelectorAll('tr.model-row')) {
    [...tr.children].forEach((td, i) => { widths[i] = Math.max(widths[i], contentWidth(td)); });
  }
  const style = getComputedStyle(viewport);
  const avail = viewport.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const gap = Math.max(MIN_COL_GAP, (avail - widths.reduce((a, b) => a + b, 0)) / (widths.length - 1));
  widths.forEach((w, i) => { cols[i].style.width = `${Math.ceil(w) + (i < widths.length - 1 ? Math.floor(gap) : 0)}px`; });
}

// Known endpoints in ENDPOINTS order, unknown ones after them.
function sortedEndpoints(m) {
  const order = Object.keys(ENDPOINTS);
  const rank = ep => (order.includes(ep) ? order.indexOf(ep) : order.length);
  return (m.supported_endpoints || []).slice().sort((a, b) => rank(a) - rank(b));
}

function row(label, value) { return `<div><dt>${esc(label)}</dt><dd>${value}</dd></div>`; }
function dl(...rows) { return `<dl class="rows">${rows.join('')}</dl>`; }

function section(iconName, tone, title, content, aux) {
  return `<section class="section"><h4 class="section-title">${icon(iconName, tone)}${esc(title)}${aux ? `<span class="card-aux">${esc(aux)}</span>` : ''}</h4>${content}</section>`;
}

// Labels for the price fields this page knows, in display order. Any other
// *_price field in the catalog still shows, named after its key.
const PRICE_LABELS = {
  input_price: 'input', output_price: 'output', cache_price: 'cacheRead', cache_write_price: 'cacheWrite',
  cache_write_1h_price: 'cacheWrite1h', cache_write_12h_price: 'cacheWrite12h', image_input_price: 'imageInput', image_output_price: 'imageOutput',
};
const priceLabel = k => (k in PRICE_LABELS ? t(PRICE_LABELS[k]) : k.replace(/_price$/, '').replaceAll('_', ' '));

// Every *_price field in the tiers, known ones first, zero values included.
function priceKeys(tiers) {
  const present = new Set(tiers.flatMap(tier => Object.keys(tier).filter(k => k.endsWith('_price'))));
  return [...Object.keys(PRICE_LABELS).filter(k => present.has(k)), ...[...present].filter(k => !(k in PRICE_LABELS)).sort()];
}

// Every reasoning effort level the model accepts, in catalog order.
const effortLevels = levels => (Array.isArray(levels) && levels.length ? esc(levels.join(' / ')) : dash);

// Tags next to the model name for catalog notices that affect using it:
// a planned deprecation date and Anthropic's data retention warning.
function riskTags(m) {
  const tags = [];
  for (const msg of Array.isArray(m.info_messages) ? m.info_messages : []) {
    if (msg?.code !== 'model_pending_deprecation') continue;
    const date = /\d{4}-\d{2}-\d{2}/.exec(msg.message || '')?.[0];
    const label = date ? t('deprecates', { date: date.slice(0, 4) === String(new Date().getFullYear()) ? date.slice(5).replace('-', '/') : date }) : t('noticePendingDeprecation');
    tags.push(`<span class="tag tone-amber" title="${esc(msg.message || '')}">${esc(label)}</span>`);
  }
  if (m.warning_text?.data_retention) {
    tags.push(`<span class="tag tone-red" title="${esc(m.warning_text.data_retention)}">${esc(t('noticeDataRetention'))}</span>`);
  }
  return tags.join('');
}

// Table price per 1M tokens from the default tier, labeled: input and
// output on the first line, cache read and write on the second. Image models
// bill their output as image tokens; every other price is in the drawer.
function priceCell(m) {
  if (!isPriced(m)) return `<span class="muted">${esc(t('unpriced'))}</span>`;
  const p = m.billing.token_prices.default;
  const image = p.image_output_price != null;
  const item = (label, v) => `<span class="price-label">${esc(label)}:</span> ${price(v)}`;
  const sep = '<span class="price-sep">/</span>';
  return `<div class="price-lines">
    <div>${item(t('input'), p.input_price)}${sep}${image ? item(t('imageOutput'), p.image_output_price) : item(t('output'), p.output_price)}</div>
    <div>${item(t('cacheReadShort'), p.cache_price)}${sep}${item(t('cacheWriteShort'), p.cache_write_price)}</div></div>`;
}

// Rows are context tiers. A long-context tier priced like the default one
// collapses into a single row covering the whole window; any other tier the
// catalog adds gets its own row, named after its key.
function priceMatrix(m) {
  if (!isPriced(m)) return plain(`<span class="muted">${esc(t('unpriced'))}</span>`);
  const tp = m.billing.token_prices;
  const isTier = v => v && typeof v === 'object' && !Array.isArray(v);
  const short = tp.default;
  const long = isTier(tp.long_context) ? tp.long_context : null;
  const same = long && priceKeys([short, long]).every(k => long[k] === short[k]);
  // Plain text: the range is escaped below, so a missing bound must not become the dash HTML.
  const range = (sign, n) => (n == null ? '' : `${sign} ${tokens(n)}`);
  const rows = !long ? [[t('allContext'), range('≤', short.context_max), short]]
    : same ? [[t('allContext'), range('≤', long.context_max), short]]
    : [[t('shortContext'), range('≤', short.context_max), short], [t('longContext'), range('>', short.context_max), long]];
  for (const [k, v] of Object.entries(tp)) {
    if (isTier(v) && k !== 'default' && k !== 'long_context') rows.push([keyName(k), range('≤', v.context_max), v]);
  }
  const keys = priceKeys(rows.map(([, , tier]) => tier));
  return `<table class="price-matrix"><thead><tr><th>${esc(t('tier'))}</th>${keys.map(k => `<th>${esc(priceLabel(k))}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([name, range, tier]) => `<tr><td>${esc(name)}${range ? `<span class="tier-range">${esc(range)}</span>` : ''}</td>${keys.map(k => `<td>${price(tier[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

// ---------- drawer: every field the catalog gives the model ----------
const LIMIT_LABELS = {
  max_context_window_tokens: 'contextWindow', max_prompt_tokens: 'maxPrompt', max_output_tokens: 'maxOutput',
  max_non_streaming_output_tokens: 'maxNonStreaming', max_inputs: 'maxInputs',
};
const TOKEN_LIMITS = new Set(['max_context_window_tokens', 'max_prompt_tokens', 'max_output_tokens', 'max_non_streaming_output_tokens']);
const VISION_LABELS = { supported_media_types: 'mediaTypes', max_prompt_images: 'maxImages', max_prompt_image_size: 'maxImageSize' };
const SUPPORT_LABELS = {
  tool_calls: 'toolCalls', parallel_tool_calls: 'parallelToolCalls', structured_outputs: 'structured', streaming: 'streaming',
  vision: 'vision', reasoning_effort: 'effort', adaptive_thinking: 'adaptive', min_thinking_budget: 'minThinking',
  max_thinking_budget: 'maxThinking', dimensions: 'dimensions',
};
const NOTICE_LABELS = { model_pending_deprecation: 'noticePendingDeprecation', data_retention: 'noticeDataRetention' };
const PLAN_LABELS = { individual_trial: 'planTrial', edu: 'planEdu' };
const PLAN_NAMES = { free: 'Free', pro: 'Pro', pro_plus: 'Pro+', max: 'Max', business: 'Business', enterprise: 'Enterprise' };
const VALUE_LABELS = {
  chat: 'typeChat', image: 'typeImage', decisions: 'typeDecisions', embeddings: 'typeEmbeddings', completion: 'typeCompletion',
  low: 'levelLow', medium: 'levelMedium', high: 'levelHigh', very_high: 'levelVeryHigh', enabled: 'policyEnabled', disabled: 'policyDisabled',
};
// Fields with a fixed place in the drawer; `object` only names the JSON type.
const PLACED = {
  model: ['id', 'name', 'vendor', 'version', 'object', 'preview', 'capabilities', 'billing', 'policy', 'supported_endpoints',
    'model_picker_enabled', 'model_picker_category', 'model_picker_price_category', 'is_chat_default', 'is_chat_fallback',
    'info_messages', 'warning_text'],
  capabilities: ['family', 'type', 'tokenizer', 'object', 'limits', 'supports'],
  tokenPrices: ['default', 'long_context', 'batch_size', 'preferred_tier'],
};

const PRICING_DOCS = 'https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing';
const keyName = k => k.replaceAll('_', ' ');
const fieldLabel = (labels, k) => (k in labels ? t(labels[k]) : keyName(k));
// Known keys in their listed order, then any others as the catalog has them.
const orderedKeys = (obj, labels) => [...Object.keys(labels).filter(k => k in obj), ...Object.keys(obj).filter(k => !(k in labels))];
const fmtBytes = n => (n >= 1048576 ? `${trimFixed(n / 1048576, 1)} MB` : `${trimFixed(n / 1024, 1)} KB`);
const planName = p => (p in PLAN_LABELS ? t(PLAN_LABELS[p]) : PLAN_NAMES[p] || p);
const tierName = k => (k === 'default' ? t('shortContext') : k === 'long_context' ? t('longContext') : keyName(k));

// One catalog value as HTML: booleans as yes/no (or supported/not), lists
// joined, objects as compact JSON, known words translated.
function fmt(v, { bool = 'yes', num } = {}) {
  if (v == null || v === '') return dash;
  if (typeof v === 'boolean') return esc(bool === 'support' ? t(v ? 'supported' : 'unsupported') : t(v ? 'yes' : 'no'));
  if (Array.isArray(v)) return v.length ? esc(v.map(x => (typeof x === 'object' ? JSON.stringify(x) : x)).join(' / ')) : dash;
  if (typeof v === 'object') return `<code>${esc(JSON.stringify(v))}</code>`;
  if (typeof v === 'number') return esc(num ? num(v) : v.toLocaleString('en-US'));
  return esc(v in VALUE_LABELS ? t(VALUE_LABELS[v]) : v);
}

// Rows for the fields of obj not listed in placed, named after their keys.
const extraRows = (obj, placed) => Object.keys(obj || {}).filter(k => !placed.includes(k)).map(k => row(keyName(k), fmt(obj[k])));
const block = (label, html) => `<div class="is-block"><dt>${esc(label)}</dt><dd>${html}</dd></div>`;
const plain = html => `<div class="section-text">${html}</div>`;
const rowsOrDash = rows => (rows.length ? dl(...rows) : plain(dash));
// Policy terms may carry Markdown links; only https links become anchors.
const mdLinks = text => esc(text).replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

function noticesHtml(m) {
  const notices = [
    ...(Array.isArray(m.info_messages) ? m.info_messages : []).map(x => ['info', x?.code || '', x?.message ?? x]),
    ...Object.entries(m.warning_text || {}).map(([k, v]) => ['warn', k, v]),
  ];
  return notices.map(([kind, code, text]) => `<div class="notice notice-${kind}">${icon('circle-alert')}<div>
    ${code ? `<div class="notice-title">${esc(fieldLabel(NOTICE_LABELS, code))}</div>` : ''}
    <div>${esc(typeof text === 'string' ? text : JSON.stringify(text))}</div></div></div>`).join('');
}

function limitsHtml(m) {
  const lim = m.capabilities?.limits || {};
  const vision = lim.vision && typeof lim.vision === 'object' ? lim.vision : {};
  return rowsOrDash([
    ...orderedKeys(lim, LIMIT_LABELS).filter(k => k !== 'vision')
      .map(k => row(fieldLabel(LIMIT_LABELS, k), fmt(lim[k], { num: TOKEN_LIMITS.has(k) ? tokens : null }))),
    ...orderedKeys(vision, VISION_LABELS).map(k => row(fieldLabel(VISION_LABELS, k), k === 'supported_media_types' && Array.isArray(vision[k])
      ? fmt(vision[k].map(x => String(x).split('/').pop().toUpperCase()))
      : fmt(vision[k], { num: k === 'max_prompt_image_size' ? fmtBytes : null }))),
  ]);
}

function pricingHtml(m) {
  const billing = m.billing || {};
  const tp = billing.token_prices || {};
  const meta = [];
  if (Array.isArray(billing.restricted_to)) meta.push(row(t('plans'), fmt(billing.restricted_to.map(planName))));
  if (tp.preferred_tier) meta.push(row(t('preferredTier'), esc(tierName(tp.preferred_tier))));
  meta.push(...Object.keys(tp).filter(k => !PLACED.tokenPrices.includes(k) && (tp[k] == null || typeof tp[k] !== 'object'))
    .map(k => row(keyName(k), fmt(tp[k]))));
  meta.push(...extraRows(billing, ['token_prices', 'restricted_to']));
  const imageNote = tp.default?.image_output_price != null
    ? `<p class="price-note">${esc(t('imagePriceNote'))} <a href="${PRICING_DOCS}" target="_blank" rel="noopener">${esc(t('pricingDocs'))}</a></p>` : '';
  return priceMatrix(m) + imageNote + (meta.length ? dl(...meta) : '');
}

function capabilitiesHtml(m) {
  const s = m.capabilities?.supports || {};
  return rowsOrDash(orderedKeys(s, SUPPORT_LABELS).map(k => row(fieldLabel(SUPPORT_LABELS, k),
    fmt(s[k], { bool: 'support', num: k.endsWith('_thinking_budget') ? tokens : null }))));
}

function detailsHtml(m) {
  const caps = m.capabilities || {};
  const policy = m.policy || {};
  const opt = (label, v, html = fmt(v)) => (v === undefined ? '' : row(label, html));
  const category = m.model_picker_category;
  return dl(
    opt(t('version'), m.version),
    opt(t('family'), caps.family),
    opt(t('modelType'), caps.type),
    opt(t('tokenizer'), caps.tokenizer),
    opt(t('pickerCategory'), category, CATEGORIES.includes(category) ? esc(t(category)) : fmt(category)),
    opt(t('priceCategory'), m.model_picker_price_category),
    opt(t('pickerEnabled'), m.model_picker_enabled),
    opt(t('chatDefault'), m.is_chat_default),
    opt(t('chatFallback'), m.is_chat_fallback),
    opt(t('preview'), m.preview),
    opt(t('policyState'), policy.state),
    policy.terms ? block(t('policyTerms'), mdLinks(policy.terms)) : '',
    ...extraRows(policy, ['state', 'terms']),
    ...extraRows(caps, PLACED.capabilities),
    ...extraRows(m, PLACED.model),
  );
}

function renderDrawer() {
  const m = state.openId ? state.models.find(x => x.id === state.openId) : null;
  $('drawer').hidden = !m;
  if (!m) return;
  $('drawer-logo').innerHTML = vendorLogo(m.vendor, 'is-large');
  $('drawer-title').textContent = m.name || m.id;
  $('drawer-sub').innerHTML = `<span class="model-id">${esc(m.id)}</span>`
    + (m.vendor ? `<span class="tag tone-slate">${esc(m.vendor)}</span>` : '')
    + (CATEGORIES.includes(m.model_picker_category) ? `<span class="tag tone-${CATEGORY_TONES[m.model_picker_category]}">${esc(t(m.model_picker_category))}</span>` : '')
    + (m.preview ? `<span class="tag tone-amber">${esc(t('preview'))}</span>` : '');

  const eps = sortedEndpoints(m);
  $('drawer-body').innerHTML = noticesHtml(m) + [
    section('gauge', 'text-blue', t('limits'), limitsHtml(m)),
    section('wallet', 'text-amber', t('pricing'), pricingHtml(m), t('priceUnit')),
    section('sparkles', 'text-purple', t('capabilities'), capabilitiesHtml(m)),
    section('route', 'text-teal', t('endpoints'), plain(eps.length ? `<div class="endpoints">${eps.map(ep => endpointTag(ep, true)).join('')}</div>` : dash)),
    section('boxes', 'text-blue', t('details'), detailsHtml(m)),
  ].join('');
}

function render() { renderStatic(); renderConnection(); renderUser(); renderUpdate(); renderTable(); renderDrawer(); }

// ---------- behaviour ----------
function openModel(id) {
  if (state.openId === id) { closeDrawer(); return; }
  state.openId = id;
  renderTable();
  renderDrawer();
  $('drawer-body').scrollTop = 0;
  $('drawer-title').focus();
}

function closeDrawer() {
  if (!state.openId) return;
  const id = state.openId;
  state.openId = null;
  renderTable();
  renderDrawer();
  // renderTable() rebuilt the rows, so look the reopened row up again.
  document.querySelector(`.model-row[data-id="${CSS.escape(id)}"]`)?.focus();
}

function setMenu(open) {
  $('menu').hidden = !open;
  $('user-btn').setAttribute('aria-expanded', String(open));
}

async function fetchJSON(url, init) {
  const resp = await fetch(url, init);
  if (resp.status === 401) { location.href = '/login'; throw new Error('unauthenticated'); }
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || resp.statusText);
  return body;
}

async function loadConfig() {
  try {
    const body = await fetchJSON('/web/api/config');
    state.apiKeys = body.api_keys || [];
    state.username = body.username || '';
    state.update = body.update || null;
    renderConnection();
    renderUser();
    renderUpdate();
  } catch (e) { console.warn('config load failed:', e); }
}

async function loadModels(fromUpstream = false) {
  const btn = $('fetch');
  const glyph = $('fetch-icon');
  btn.disabled = true;
  glyph.setAttribute('href', '/web/assets/icons.svg#loader-circle');
  glyph.parentElement.classList.add('spin');
  try {
    const body = await fetchJSON(fromUpstream ? '/web/api/models/refresh' : '/web/api/models', fromUpstream ? { method: 'POST' } : undefined);
    state.models = body.data || [];
    state.cachedAt = body.cached_at;
    state.loadError = '';
    if (fromUpstream) CGW.toast(t('fetched'));
  } catch (e) {
    if (state.loaded && !state.loadError) CGW.toast(t('fetchFail'), 'error');
    else state.loadError = e.message;
  } finally {
    state.loaded = true;
    btn.disabled = false;
    glyph.setAttribute('href', '/web/assets/icons.svg#cloud-download');
    glyph.parentElement.classList.remove('spin');
    if (state.provider && !providerOptions().some(([v]) => v === state.provider)) state.provider = '';
    if (state.openId && !state.models.some(m => m.id === state.openId)) state.openId = null;
    renderStatic();
    renderTable();
    renderDrawer();
  }
}

$('fetch').addEventListener('click', () => loadModels(true));
$('drawer-close').addEventListener('click', closeDrawer);

$('provider-btn').addEventListener('click', () => setProviderMenu($('provider-menu').hidden));
$('provider-menu').addEventListener('click', e => {
  const opt = e.target.closest('[data-provider]');
  if (!opt) return;
  state.provider = opt.dataset.provider;
  setProviderMenu(false);
  if (state.openId && !visibleModels().some(m => m.id === state.openId)) state.openId = null;
  renderStatic();
  renderTable();
  renderDrawer();
});

window.addEventListener('resize', () => requestAnimationFrame(balanceColumns));
document.fonts?.ready.then(balanceColumns);

$('table-body').addEventListener('click', e => {
  const rowEl = e.target.closest('.model-row');
  if (rowEl) openModel(rowEl.dataset.id);
});
$('table-body').addEventListener('keydown', e => {
  const rowEl = e.target.closest('.model-row');
  if (rowEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModel(rowEl.dataset.id); }
});

document.addEventListener('click', async e => {
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    try {
      await navigator.clipboard.writeText(copyBtn.dataset.copy);
      CGW.toast(t('copied', { name: copyBtn.dataset.name }));
    } catch { CGW.toast(t('copyFail'), 'error'); }
    return;
  }
  if (!e.target.closest('.user-menu')) setMenu(false);
  if (!e.target.closest('.filter')) setProviderMenu(false);
});

$('user-btn').addEventListener('click', () => setMenu($('menu').hidden));
$('menu-lang').addEventListener('click', () => {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  render();
});
$('menu-logout').addEventListener('click', async () => {
  await fetch('/auth/logout', { method: 'POST' }).catch(() => null);
  location.href = '/login';
});

// Esc closes the topmost layer first: an open menu, then the drawer.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('menu').hidden) { setMenu(false); $('user-btn').focus(); return; }
  if (!$('provider-menu').hidden) { setProviderMenu(false); $('provider-btn').focus(); return; }
  closeDrawer();
});

render();
loadConfig();
loadModels();
</script>
</body>
</html>
