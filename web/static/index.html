<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>模型目录 · CopilotGateway</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">
<div x-data="modelsPage()" x-init="load(); loadConfig()" class="max-w-5xl mx-auto px-4 py-10">

  <header class="flex items-end justify-between mb-6">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight" x-text="t('title')"></h1>
      <p class="text-sm text-gray-500 mt-1">
        CopilotGateway · <span x-text="t('subtitle')"></span><span x-show="cachedAt"> · <span x-text="t('cached') + ' ' + fmtTime(cachedAt)"></span></span>
      </p>
    </div>
    <div class="flex items-center gap-4">
      <button @click="setLang(lang === 'zh' ? 'en' : 'zh')" aria-label="Switch language"
        class="text-sm text-gray-500 hover:text-indigo-600 transition-colors"
        x-text="lang === 'zh' ? 'EN' : '中文'"></button>
      <button @click="logout()"
        class="text-sm text-gray-500 hover:text-red-600 transition-colors" x-text="t('logout')"></button>
    </div>
  </header>

  <template x-if="error">
    <div class="bg-white border border-red-200 text-red-700 rounded-xl p-4 mb-6 text-sm break-words" x-text="error"></div>
  </template>

  <div x-show="apiKeys.length" x-cloak class="bg-white rounded-2xl border border-gray-200 px-5 py-4 mb-6">
    <h2 class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-3" x-text="t('access')"></h2>
    <dl class="space-y-2 text-sm">
      <div class="flex items-center justify-between gap-4">
        <dt class="text-gray-500 shrink-0">Endpoint</dt>
        <dd class="flex items-center gap-2 min-w-0">
          <span class="font-mono text-gray-900 truncate" x-text="endpoint" :title="endpoint"></span>
          <button @click="copy(endpoint, 'ep')" :aria-label="t('copyTip')" :title="copied === 'ep' ? t('copiedTip') : t('copyTip')"
            class="shrink-0 p-1.5 rounded-lg text-gray-400 hover:text-indigo-600 hover:bg-gray-100 transition-colors">
            <svg x-show="copied !== 'ep'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <svg x-show="copied === 'ep'" x-cloak class="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
        </dd>
      </div>
      <template x-for="(k, i) in apiKeys" :key="k">
        <div class="flex items-center justify-between gap-4">
          <dt class="text-gray-500 shrink-0">API Key</dt>
          <dd class="flex items-center gap-2 min-w-0">
            <span class="font-mono text-gray-900 truncate" x-text="mask(k)"></span>
            <button @click="copy(k, 'key' + i)" :aria-label="t('copyTip')" :title="copied === 'key' + i ? t('copiedTip') : t('copyTip')"
              class="shrink-0 p-1.5 rounded-lg text-gray-400 hover:text-indigo-600 hover:bg-gray-100 transition-colors">
              <svg x-show="copied !== 'key' + i" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg x-show="copied === 'key' + i" x-cloak class="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
          </dd>
        </div>
      </template>
    </dl>
  </div>

  <div x-show="all.length" x-cloak class="flex items-center justify-between mb-2 px-1">
    <span class="text-xs text-gray-400"
      x-text="showAll ? t('allCount', {n: all.length}) : t('curatedCount', {n: curated.length})"></span>
    <button @click="showAll = !showAll"
      class="text-xs text-gray-500 hover:text-indigo-600 transition-colors"
      x-text="showAll ? t('showLatest') : t('showAll')"></button>
  </div>

  <div x-show="models.length" x-cloak
    class="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">
    <template x-for="m in models" :key="m.id">
      <div>
        <button @click="toggle(m.id)"
          class="w-full flex items-center gap-4 px-5 py-3.5 text-left hover:bg-gray-50 transition-colors">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-medium" x-text="m.name || m.id"></span>
              <span x-show="m.preview"
                class="text-xs px-1.5 py-0.5 rounded-md bg-amber-50 text-amber-700">preview</span>
              <span x-show="m.model_picker_enabled"
                class="text-xs px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700">picker</span>
              <span x-show="m.vendor" :class="vendorClass(m.vendor)"
                class="text-xs px-1.5 py-0.5 rounded-md" x-text="m.vendor"></span>
            </div>
            <div class="flex items-center gap-3 flex-wrap mt-0.5 text-xs">
              <span class="text-gray-500 font-mono break-words" x-text="m.id"></span>
              <span class="text-gray-400"><span x-text="t('prices')"></span>
                <span class="text-gray-700 font-medium" x-text="priceLine(m)"></span>
              </span>
            </div>
          </div>
          <div class="text-right text-xs text-gray-600 shrink-0 space-y-1">
            <div><span x-text="t('context')"></span> <span class="font-medium text-gray-900" x-text="fmt(m.capabilities?.limits?.max_context_window_tokens)"></span></div>
            <div class="flex justify-end gap-1 flex-wrap">
              <template x-for="ep in endpoints(m)" :key="ep">
                <span class="px-1.5 py-0.5 rounded-md" :class="epClass(ep)" x-text="ep"></span>
              </template>
              <span x-show="!(m.supported_endpoints || []).length" class="text-gray-400">—</span>
            </div>
          </div>
        </button>
      </div>
    </template>
  </div>

  <p x-show="!models.length && !error" class="text-sm text-gray-400 text-center py-16" x-text="t('loading')"></p>

  <!-- 模型详情弹窗:点击行打开,遮罩/ESC/✕ 关闭 -->
  <div x-show="openModel" x-cloak @keydown.escape.window="open = null"
    class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-gray-900/40" @click="open = null"></div>
    <div x-show="openModel" x-transition
      class="relative bg-white rounded-2xl shadow-xl w-full max-w-xl p-6">
      <template x-if="openModel">
        <div>
          <div class="flex items-start justify-between gap-4">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-lg font-semibold" x-text="openModel.name || openModel.id"></h2>
                <span x-show="openModel.preview"
                  class="text-xs px-1.5 py-0.5 rounded-md bg-amber-50 text-amber-700">preview</span>
                <span x-show="openModel.vendor" :class="vendorClass(openModel.vendor)"
                  class="text-xs px-1.5 py-0.5 rounded-md" x-text="openModel.vendor"></span>
              </div>
              <div class="text-xs text-gray-500 font-mono mt-0.5 break-words" x-text="openModel.id"></div>
            </div>
            <button @click="open = null" :aria-label="t('close')"
              class="shrink-0 p-1.5 -m-1 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <dl class="mt-5 space-y-2 text-sm">
            <template x-for="row in capabilityRows(openModel)" :key="row.label">
              <div class="grid grid-cols-[9rem_1fr] gap-3">
                <dt class="text-gray-500" x-text="row.label"></dt>
                <dd class="text-gray-900 text-right break-words" x-text="row.value"></dd>
              </div>
            </template>
          </dl>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
// 页面文案字典:zh/en 两套,key 一一对应;{n}/{mb} 为插值占位符
const I18N = {
  zh: {
    docTitle: '模型目录 · CopilotGateway',
    title: '模型目录',
    subtitle: '当前可用的最新模型(数据来自上游 /models)',
    cached: '缓存于',
    logout: '退出登录',
    access: '接入信息',
    copyTip: '复制', copiedTip: '已复制',
    curatedCount: '每系列最新,共 {n} 个',
    allCount: '上游完整目录,共 {n} 个',
    showAll: '显示全部', showLatest: '只看最新',
    loading: '加载中…', loadFail: '加载失败',
    context: '上下文',
    prices: '输入/输出/缓存读/缓存写',
    maxIO: '最大输入/输出',
    tools: '工具调用', yes: '支持', parallel: '(可并行)',
    structured: '结构化输出', streaming: '流式',
    effort: 'Reasoning effort', budget: '思考预算',
    vision: '视觉', imgCount: '最多 {n} 张', imgSize: '单张 ≤{mb}MB',
    close: '关闭',
  },
  en: {
    docTitle: 'Model Catalog · CopilotGateway',
    title: 'Model Catalog',
    subtitle: 'latest available models (from upstream /models)',
    cached: 'cached at',
    logout: 'Sign out',
    access: 'Connection',
    copyTip: 'Copy', copiedTip: 'Copied',
    curatedCount: 'Latest per series · {n} models',
    allCount: 'Full upstream catalog · {n} models',
    showAll: 'Show all', showLatest: 'Latest only',
    loading: 'Loading…', loadFail: 'Failed to load',
    context: 'Context',
    prices: 'in/out/cache-read/cache-write',
    maxIO: 'Max input/output',
    tools: 'Tool calls', yes: 'Supported', parallel: ' (parallel)',
    structured: 'Structured outputs', streaming: 'Streaming',
    effort: 'Reasoning effort', budget: 'Thinking budget',
    vision: 'Vision', imgCount: 'up to {n} images', imgSize: '≤{mb}MB each',
    close: 'Close',
  },
};

function modelsPage() {
  return {
    all: [], curated: [], showAll: false, cachedAt: null, error: '', open: null,
    endpoint: location.origin, apiKeys: [], copied: '',
    // 语言:localStorage 记忆,首次跟随浏览器
    lang: localStorage.getItem('cgw_lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'),

    t(key, vars) {
      let s = (I18N[this.lang] || I18N.zh)[key] || key;
      if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll('{' + k + '}', v);
      return s;
    },
    setLang(l) {
      this.lang = l;
      localStorage.setItem('cgw_lang', l);
      document.title = this.t('docTitle');
    },
    fmtTime(ts) { return new Date(ts).toLocaleString(this.lang === 'zh' ? 'zh-CN' : 'en-US'); },

    // 展示列表:默认精选视图(每系列最新),可切换为上游完整目录
    get models() { return this.showAll ? this.all : this.curated; },
    // 弹窗当前展示的模型(open 存 id)
    get openModel() { return this.open ? this.all.find(m => m.id === this.open) || null : null; },

    // 接入信息独立加载,失败只在控制台告警,不阻塞模型列表
    async loadConfig() {
      document.title = this.t('docTitle');
      try {
        const resp = await fetch('/web/api/config');
        if (resp.ok) {
          const body = await resp.json();
          this.apiKeys = body.api_keys || [];
        }
      } catch (e) { console.warn('config load failed:', e); }
    },

    mask(k) { return k.length > 14 ? k.slice(0, 10) + '…' + k.slice(-4) : k; },

    async copy(text, tag) {
      try {
        await navigator.clipboard.writeText(text);
        this.copied = tag;
        setTimeout(() => { if (this.copied === tag) this.copied = ''; }, 1500);
      } catch (e) { console.warn('copy failed:', e); }
    },

    async load() {
      try {
        const resp = await fetch('/web/api/models');
        if (resp.status === 401) { location.href = '/login'; return; }
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          this.error = body.error || (this.t('loadFail') + ': HTTP ' + resp.status);
          return;
        }
        const body = await resp.json();
        // 只展示当前代际的聊天模型(picker 启用),隐藏上游目录里的历史遗留条目
        const list = (body.data || []).filter(m => m.model_picker_enabled && m.capabilities?.type === 'chat');
        // 系列划分:Claude 按 opus/sonnet/haiku/fable 子系列;Gemini 按 Pro/Flash;
        // 其余品牌取 id 第一段(gpt/kimi/…)。每个系列保留「最新一代的全部型号」:
        // 只比版本号数字,取最高的一代,该代型号(含 preview/fast 等变体)全部显示。
        const seriesOf = id => {
          const c = /^claude-([a-z]+)/.exec(id);
          if (c) return 'claude-' + c[1];
          const g = /^gemini.*-(pro|flash)\b/.exec(id);
          if (g) return 'gemini-' + g[1];
          return id.split('-')[0];
        };
        const verOf = id => { const t = /(\d+(?:\.\d+)?)/.exec(id); return t ? parseFloat(t[1]) : 0; };
        const groups = new Map();
        for (const m of list) {
          const key = seriesOf(m.id);
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(m);
        }
        const kept = [];
        for (const arr of groups.values()) {
          const maxVer = Math.max(...arr.map(m => verOf(m.id)));
          kept.push(...arr.filter(m => verOf(m.id) === maxVer));
        }
        // 排序:厂商字母序分组,组内按输入价格降序(旗舰→轻量),同价按 id 字母序
        const priceOf = m => m.billing?.token_prices?.default?.input_price ?? 0;
        const sortModels = arr => [...arr].sort((a, b) =>
          (a.vendor || '').localeCompare(b.vendor || '') ||
          (priceOf(b) - priceOf(a)) ||
          a.id.localeCompare(b.id));
        this.all = sortModels(body.data || []);
        this.curated = sortModels(kept);
        this.cachedAt = body.cached_at;
      } catch (e) {
        this.error = this.t('loadFail') + ': ' + e;
      }
    },

    toggle(id) { this.open = this.open === id ? null : id; },
    async logout() { await fetch('/auth/logout', { method: 'POST' }); location.href = '/login'; },

    fmt(n) { return n == null ? '—' : Number(n).toLocaleString(); },
    // 上游价格单位是「美分/每 1M token」,除以 100 得美元
    price(v) { return v == null ? '—' : '$' + (v / 100).toFixed(2); },

    vendorClass(v) {
      const map = {
        'Anthropic': 'bg-orange-50 text-orange-700',
        'OpenAI': 'bg-emerald-50 text-emerald-700',
        'Azure OpenAI': 'bg-blue-50 text-blue-700',
      };
      return map[v] || 'bg-purple-50 text-purple-700';
    },

    // 端点固定排序:不同模型展示顺序一致,未知端点按字母序垫底
    endpoints(m) {
      const order = ['/v1/messages', '/chat/completions', '/responses', 'ws:/responses'];
      const rank = ep => { const i = order.indexOf(ep); return i < 0 ? order.length : i; };
      return [...(m.supported_endpoints || [])].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
    },

    // 端点分色:各 API 形态一眼可辨,未知端点灰色兜底
    epClass(ep) {
      const map = {
        '/v1/messages': 'bg-orange-50 text-orange-700',
        '/chat/completions': 'bg-blue-50 text-blue-700',
        '/responses': 'bg-emerald-50 text-emerald-700',
        'ws:/responses': 'bg-purple-50 text-purple-700',
      };
      return map[ep] || 'bg-gray-100 text-gray-600';
    },

    capabilityRows(m) {
      const s = m.capabilities?.supports || {};
      const lim = m.capabilities?.limits || {};
      const rows = [
        { label: this.t('maxIO'), value: this.fmt(lim.max_prompt_tokens) + ' / ' + this.fmt(lim.max_output_tokens) },
        { label: this.t('tools'), value: s.tool_calls ? this.t('yes') + (s.parallel_tool_calls ? this.t('parallel') : '') : '—' },
        { label: this.t('structured'), value: s.structured_outputs ? this.t('yes') : '—' },
        { label: this.t('streaming'), value: s.streaming ? this.t('yes') : '—' },
        { label: this.t('effort'), value: (s.reasoning_effort || []).join(' / ') || '—' },
      ];
      if (s.adaptive_thinking) {
        rows.push({ label: this.t('budget'), value: this.fmt(s.min_thinking_budget) + ' – ' + this.fmt(s.max_thinking_budget) });
      }
      if (s.vision) {
        const v = lim.vision || {};
        const mb = v.max_prompt_image_size ? this.t('imgSize', {mb: (v.max_prompt_image_size / 1048576).toFixed(0)}) : null;
        const types = (v.supported_media_types || []).map(t => t.split('/')[1]).join('/');
        rows.push({ label: this.t('vision'), value: [this.t('imgCount', {n: this.fmt(v.max_prompt_images)}), mb, types || null].filter(Boolean).join(' · ') });
      }
      return rows;
    },

    // 标题下的价格行:输入/输出/缓存读/缓存写,单位美元每 1M token
    priceLine(m) {
      const p = m.billing?.token_prices?.default || {};
      return [p.input_price, p.output_price, p.cache_price, p.cache_write_price]
        .map(v => this.price(v)).join(' / ');
    },
  };
}
</script>
<style>[x-cloak]{display:none!important}</style>
</body>
</html>
