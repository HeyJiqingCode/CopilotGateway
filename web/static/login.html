<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/web/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/web/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/web/assets/apple-touch-icon.png">
<title>CopilotGateway</title>
<link rel="stylesheet" href="/web/assets/app.css">
<script src="/web/assets/app.js"></script>
</head>
<body class="login-body">
<button id="lang-toggle" class="pill-btn login-lang" type="button"></button>
<main class="login-page">
  <div class="card login-card">
    <div class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/web/assets/icons.svg#waypoints"></use></svg></span>CopilotGateway</div>
    <form id="login-form">
      <fieldset id="login-fields">
        <label class="field">
          <span class="field-label" id="label-username"></span>
          <input class="input" id="username" name="username" type="text" required autocomplete="username" autofocus>
        </label>
        <label class="field">
          <span class="field-label" id="label-password"></span>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password">
        </label>
        <button class="btn-primary" type="submit" id="btn-submit"></button>
      </fieldset>
    </form>
  </div>
</main>
<script>
const I18N = {
  zh: { docTitle: '登录 · CopilotGateway', username: '用户名', password: '密码', submit: '登录',
        badCred: '用户名或密码错误', fail: '登录失败，请稍后重试', toggle: 'English' },
  en: { docTitle: 'Sign in · CopilotGateway', username: 'Username', password: 'Password', submit: 'Sign in',
        badCred: 'Invalid username or password', fail: 'Sign-in failed, please try again', toggle: '中文' },
};
let lang = CGW.getLang();
const t = key => I18N[lang][key];

function applyLang() {
  CGW.setLang(lang);
  document.title = t('docTitle');
  document.getElementById('label-username').textContent = t('username');
  document.getElementById('label-password').textContent = t('password');
  document.getElementById('btn-submit').textContent = t('submit');
  document.getElementById('lang-toggle').textContent = t('toggle');
}
applyLang();

document.getElementById('lang-toggle').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyLang();
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fields = document.getElementById('login-fields');
  fields.disabled = true;
  const resp = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    }),
  }).catch(() => null);
  if (resp && resp.ok) { location.href = '/'; return; }
  fields.disabled = false;
  CGW.toast(resp && resp.status === 401 ? t('badCred') : t('fail'), 'error');
});
</script>
</body>
</html>
